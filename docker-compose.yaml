services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      SAMPLE_DATA_DIR: /sample_data
    volumes:
      - ./sample_data:/sample_data:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: ${API_URL:-http://backend:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
