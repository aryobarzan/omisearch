name: CI

# Run these checks on pushes and pull requests targeting the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Backend Python unit tests (dge/network) and FastAPI integration tests - no Docker required
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Execute all shell steps from the backend/ subfolder
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Match the Python 3.15 runtime used in backend/Dockerfile and cache pip downloads
      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # Runs all tests under backend/tests/ (configured via backend/pytest.ini)
      - name: Run unit & API tests
        run: pytest -v

  # Job 2: Frontend ESLint check and Next.js 16 TypeScript/production build
  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Execute all shell steps from the frontend/ subfolder
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pin pnpm to match frontend/package.json and frontend/Dockerfile
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      # Match the Node.js 24 runtime used in frontend/Dockerfile and cache the pnpm store
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Fail if pnpm-lock.yaml is out of sync with package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Verifies TypeScript types, Turbopack bundling, and Next.js prerendering
      - name: Production build
        run: pnpm build
